name: One-shot Mastodon 4.7.2 critical backport

on:
  push:
    branches:
      - sync/20260915-mastodon-4.7.2-critical-fixes
    paths:
      - .github/workflows/backport-mastodon-4.7.2-critical.yml

permissions:
  contents: write

jobs:
  backport:
    if: github.event.head_commit.message == 'chore: stage Mastodon 4.7.2 critical backport'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Backport published Mastodon 4.7.2 fixes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'BlueLab Upstream Sync'
          git config user.email 'upstream-sync@users.noreply.github.com'

          git remote add mastodon-official https://github.com/mastodon/mastodon.git
          git fetch --no-tags mastodon-official refs/tags/v4.7.2:refs/tags/mastodon-v4.7.2

          # Published v4.7.2 fixes not yet present in the BlueLab upstream ancestry.
          fixes=(
            4e15f3db70bd0cd9c82f163495e71dea63dd59d9
            0f48833d8d06e5442c2cf74afd53a2f263ceccae
            fa6ea7e518463ec19d81743d538a7062250968af
            1cbf33f65f70c567ac4a1552571d3259af0dc433
            1062aedf1ddd393f56cd4c44e754554b62e58559
          )

          for sha in "${fixes[@]}"; do
            echo "Applying upstream fix $sha"
            if ! git cherry-pick "$sha"; then
              echo "::error::Conflict while applying $sha; refusing to publish a partial backport."
              git status --short
              git cherry-pick --abort || true
              exit 1
            fi
          done

          # v4.7.2 security note: temporarily disable HEIF support. The BlueLab
          # file at the starting SHA is byte-for-byte the previous upstream file,
          # so take this one file from the pinned published tag rather than from main.
          git show mastodon-v4.7.2:config/initializers/vips.rb > config/initializers/vips.rb
          git add config/initializers/vips.rb
          git commit -m 'security: backport Mastodon 4.7.2 HEIF mitigation'

          # Lightweight validation before publishing anything from this one-shot job.
          git diff --check "${{ github.sha }}..HEAD"
          ruby -c app/models/form/import.rb
          ruby -c app/models/user.rb
          ruby -c app/services/post_status_service.rb
          ruby -c config/initializers/vips.rb

          # Remove the temporary automation from the resulting integration branch.
          git rm .github/workflows/backport-mastodon-4.7.2-critical.yml
          git commit -m 'chore: remove one-shot Mastodon backport workflow'

          git push origin HEAD:refs/heads/sync/20260915-mastodon-4.7.2-critical-fixes

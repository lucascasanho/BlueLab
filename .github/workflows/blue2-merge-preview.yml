name: BlueLab 2.0 full restore

on:
  push:
    branches:
      - sync/20260902-blue2-full-restore

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/20260902-blue2-full-restore
          fetch-depth: 0

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Merge BlueLab 2.0 and resolve alpha2 compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin theme/blue-2.0

          set +e
          git merge --no-commit --no-ff origin/theme/blue-2.0
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            echo "Resolving expected compatibility conflicts..."
            for file in \
              app/javascript/styles/blue-2.scss \
              app/javascript/styles/blue-2-v2.scss \
              app/javascript/styles/blue-2-v5.scss \
              app/javascript/styles/blue-2-v6.scss; do
              git checkout --ours -- "$file"
              git add "$file"
            done

            git rm -f app/javascript/mastodon/features/direct_timeline/index.jsx || true
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$unresolved"
            exit 1
          fi

          rm .github/workflows/blue2-merge-preview.yml
          git add -A

          yarn format
          git add -A
          git diff --cached --check

          git commit -m "Merge BlueLab 2.0 into Mastodon 4.8.0-alpha.2"
          git push origin HEAD:sync/20260902-blue2-full-restore

name: Temporary BlueLab ESLint auto-fix
on:
  push:
    branches:
      - BlueLab-Test
    paths:
      - '.github/workflows/bluelab-eslint-fix.yml'
permissions:
  contents: write
jobs:
  eslint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JavaScript environment
        uses: ./.github/actions/setup-javascript
      - name: Record auto-fix base SHA
        run: echo "ESLINT_BASE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Apply ESLint auto-fixes
        run: yarn lint:js --fix || true
      - name: Commit auto-fixable changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            HUSKY=0 LEFTHOOK=0 git -c core.hooksPath=/dev/null commit -m "style: apply ESLint auto-fixes to alpha integration"
            git push origin HEAD:refs/heads/BlueLab-Test || echo "::warning::Push failed; inspect the generated lint patch"
          fi
      - name: Summarize changes
        if: always()
        run: git diff --stat "$ESLINT_BASE_SHA"

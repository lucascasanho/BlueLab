name: BlueLab format alpha2 integration

on:
  push:
    branches:
      - sync/20260902-mastodon-4.8.0-alpha.2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Apply repository formatter
        shell: bash
        env:
          WORKFLOW_FILE: .github/workflows/bluelab-format-alpha2-sync.yml
        run: |
          set -euo pipefail
          yarn format
          git rm -f "$WORKFLOW_FILE"
          git config user.name "BlueLab CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format alpha2 integration"
          git push origin HEAD

name: BlueLab format one file

on:
  push:
    branches:
      - 'chatgpt/20260925-bluelab-ci-clean-current'

permissions:
  contents: write

jobs:
  format-one-file:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-javascript

      - name: Format scroll control
        run: yarn oxfmt app/javascript/mastodon/features/blue2/scroll_to_top.module.scss

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/javascript/mastodon/features/blue2/scroll_to_top.module.scss
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit --no-verify -m "chore: format scroll control"
          git push

name: BlueLab RuboCop alpha2 fix

on:
  push:
    branches:
      - sync/20260902-mastodon-4.8.0-alpha.2

permissions:
  contents: write

jobs:
  autocorrect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_ONLY: development
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617
        with:
          bundler-cache: true

      - name: Apply safe and unsafe RuboCop autocorrections
        shell: bash
        env:
          WORKFLOW_FILE: .github/workflows/bluelab-rubocop-alpha2-fix.yml
        run: |
          set -euo pipefail
          bin/rubocop -A
          git rm -f "$WORKFLOW_FILE"
          git config user.name "BlueLab CI RuboCop"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply RuboCop autocorrections for alpha2 integration"
          git push origin HEAD

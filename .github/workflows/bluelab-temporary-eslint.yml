name: Temporary BlueLab ESLint autocorrect
on:
  push:
    branches:
      - BlueLab-Test
    paths:
      - '.github/workflows/bluelab-temporary-eslint.yml'
permissions:
  contents: write
jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JavaScript
        uses: ./.github/actions/setup-javascript
      - name: Record ESLint base
        run: echo "ESLINT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply ESLint autocorrections
        run: yarn eslint --cache --report-unused-disable-directives --fix
      - name: Commit safe corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            HUSKY=0 LEFTHOOK=0 git -c core.hooksPath=/dev/null commit -m "style: apply safe ESLint autocorrections"
            git push origin HEAD:refs/heads/BlueLab-Test
          fi
      - name: Report remaining ESLint findings
        if: always()
        run: yarn eslint --cache --report-unused-disable-directives || true

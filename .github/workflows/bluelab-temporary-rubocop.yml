name: Temporary BlueLab RuboCop autocorrect
# Run safe autofixes after the latest formatter pass.
on:
  push:
    branches:
      - BlueLab-Test
    paths:
      - '.github/workflows/bluelab-temporary-rubocop.yml'
permissions:
  contents: write
jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1
        with:
          bundler-cache: true
      - name: Record RuboCop base
        run: echo "RUBOCOP_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply safe autocorrections
        run: bin/rubocop -a --format simple || true
      - name: Commit safe corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            HUSKY=0 LEFTHOOK=0 git -c core.hooksPath=/dev/null commit -m "style: apply safe RuboCop autocorrections"
            git push origin HEAD:refs/heads/BlueLab-Test
          fi
      - name: Export remaining findings
        if: always()
        run: |
          bin/rubocop --format simple || true
          git diff --stat "$RUBOCOP_BASE_SHA" || true

name: BlueLab theme format fix

on:
  push:
    branches:
      - sync/20260902-mastodon-4.8.0-alpha.2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: sync/20260902-mastodon-4.8.0-alpha.2
          fetch-depth: 0

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Format restored BlueLab theme
        run: >-
          yarn format
          app/javascript/styles/blue-2.scss
          app/javascript/styles/blue-2-v2.scss
          app/javascript/styles/blue-2-v5.scss
          app/javascript/styles/blue-2-v6.scss

      - name: Remove temporary workflow
        run: rm .github/workflows/bluelab-theme-format.yml

      - name: Commit formatted theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/javascript/styles/blue-2.scss \
                  app/javascript/styles/blue-2-v2.scss \
                  app/javascript/styles/blue-2-v5.scss \
                  app/javascript/styles/blue-2-v6.scss \
                  .github/workflows/bluelab-theme-format.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Format restored BlueLab 2.0 theme"
          git push origin HEAD:sync/20260902-mastodon-4.8.0-alpha.2

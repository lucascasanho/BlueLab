name: Debug admin branding

on:
  push:
    branches:
      - stable-debug-admin-branding

permissions:
  contents: read

jobs:
  branding-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: localhost
      RAILS_ENV: test
      BUNDLE_WITH: test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: ./.github/actions/setup-ruby
        with:
          ruby-version: .ruby-version

      - uses: ./.github/actions/setup-javascript

      - name: Prepare test database
        run: bin/rails db:setup

      - name: Run admin branding request spec
        run: bundle exec rspec spec/requests/admin/settings/branding_spec.rb

name: Diagnose Base RSpec Targeted

on:
  push:
    branches:
      - 'diag/base-rspec-targeted-20260915'

env:
  BUNDLE_CLEAN: true
  BUNDLE_FROZEN: true

jobs:
  build-test-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      BUNDLE_WITH: test
      SECRET_KEY_BASE_DUMMY: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/setup-javascript
        with:
          onlyProduction: 'true'
      - run: bin/rails assets:precompile
      - run: tar --exclude={"*.br","*.gz"} -zcf artifacts.tar.gz public/assets public/packs*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          path: ./artifacts.tar.gz
          name: diag-base-targeted-assets
          retention-days: 1

  targeted-rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-test-assets
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      COVERAGE: false
      RAILS_ENV: test
      ALLOW_NOPAM: true
      PAM_ENABLED: true
      PAM_DEFAULT_SERVICE: pam_test
      PAM_CONTROLLED_SERVICE: pam_test_controlled
      OIDC_ENABLED: true
      OIDC_SCOPE: read
      SAML_ENABLED: true
      CAS_ENABLED: true
      BUNDLE_WITH: 'pam_authentication test'
      GITHUB_RSPEC: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ./
          name: diag-base-targeted-assets
      - run: tar xvzf artifacts.tar.gz
      - uses: ./.github/actions/setup-ruby
        with:
          ruby-version: '.ruby-version'
          additional-system-dependencies: ffmpeg libpam-dev
      - name: Load database schema
        run: bin/rails db:setup
      - name: Run the three failing examples
        shell: bash
        run: |
          set +e
          bundle exec rspec \
            spec/models/media_attachment_spec.rb:93 \
            spec/lib/mastodon/cli/email_domain_blocks_spec.rb:176 \
            spec/controllers/admin/statuses_controller_spec.rb:55 \
            --format documentation > targeted-rspec.log 2>&1
          rc=$?
          {
            echo '===== Full targeted output ====='
            tail -n 240 targeted-rspec.log
          } > targeted-report.txt
          echo "$rc" > rspec-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          path: |
            targeted-report.txt
            rspec-exit-code.txt
          name: diag-base-targeted-report
          retention-days: 1
      - name: Preserve RSpec exit status
        shell: bash
        run: exit "$(cat rspec-exit-code.txt)"

  report:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: targeted-rspec
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: diag-base-targeted-report
          path: report
      - name: Print targeted report
        shell: bash
        run: |
          echo 'RSpec exit code:' "$(cat report/rspec-exit-code.txt)"
          cat report/targeted-report.txt

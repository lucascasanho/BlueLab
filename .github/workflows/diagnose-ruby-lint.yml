name: One-shot Ruby lint diagnostics

on:
  push:
    branches:
      - sync/20260915-mastodon-4.7.2-critical-fixes
    paths:
      - .github/workflows/diagnose-ruby-lint.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'chore: diagnose Ruby lint'"
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: development

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617
        with:
          bundler-cache: true

      - name: Print RuboCop offenses with paths and lines
        id: rubocop
        continue-on-error: true
        run: bin/rubocop --format simple

      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueLab CI Diagnostics'
          git config user.email 'ci-diagnostics@users.noreply.github.com'
          git rm .github/workflows/diagnose-ruby-lint.yml
          git commit -m 'chore: remove one-shot Ruby lint diagnostics'
          git push origin HEAD:refs/heads/sync/20260915-mastodon-4.7.2-critical-fixes

      - name: Preserve RuboCop result
        if: steps.rubocop.outcome == 'failure'
        run: exit 1

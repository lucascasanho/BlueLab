name: Finalize alpha.3 lint blockers

on:
  push:
    branches:
      - integration/20260915-mastodon-4.8.0-alpha.3-xours
    paths:
      - .github/workflows/finalize-alpha3-lints.yml

permissions:
  contents: read

jobs:
  diagnose-ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: development
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Diagnose Ruby lint paths
        shell: bash
        run: |
          bin/rubocop --format simple || true
          bin/brakeman || true

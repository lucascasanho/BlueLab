name: Finalize alpha.3 lint blockers

on:
  push:
    branches:
      - integration/20260915-mastodon-4.8.0-alpha.3-xours
    paths:
      - .github/workflows/finalize-alpha3-lints.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply BlueLab-safe JavaScript lint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          path = 'app/javascript/mastodon/features/compose/redesign/index.tsx'
          replace(
              path,
              "  const titleId = useId();\n\n  const handleWheelCapture",
              "  const titleId = useId();\n  const sensitiveIcon = useIconWeight(PepperIcon, sensitive && 'fill');\n\n  const handleWheelCapture",
          )
          replace(path, 'leadingIcon={PepperIcon}', 'leadingIcon={sensitiveIcon}')

          path = 'app/javascript/mastodon/features/compose/redesign/visibility.tsx'
          replace(
              path,
              "  const privacy = useThreadPrivacy(activeThreadItemId);\n\n  return (",
              "  const privacy = useThreadPrivacy(activeThreadItemId);\n  const isEditing = useAppSelector((state) => !!state.compose.get('id'));\n\n  return (",
          )
          replace(
              path,
              "        <MenuTrigger size='sm' trailingIcon={CaretIcon}>",
              "        <MenuTrigger\n          as={Button}\n          size='sm'\n          trailingIcon={CaretIcon}\n          disabled={isEditing}\n        >",
          )
          replace(
              path,
              "            newQuotePolicy =\n              defaultQuotePolicy !== 'nobody' ? defaultQuotePolicy : 'public';",
              "            newQuotePolicy = lastQuotePolicy;",
          )
          replace(
              path,
              "    [activeThreadItemId, defaultQuotePolicy, dispatch],",
              "    [activeThreadItemId, dispatch, lastQuotePolicy],",
          )
          PY

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Validate JavaScript repairs
        run: |
          yarn eslint --report-unused-disable-directives --max-warnings 0 \
            app/javascript/mastodon/features/compose/redesign/index.tsx \
            app/javascript/mastodon/features/compose/redesign/visibility.tsx
          yarn typecheck
          yarn oxfmt --check \
            app/javascript/mastodon/features/compose/redesign/index.tsx \
            app/javascript/mastodon/features/compose/redesign/visibility.tsx

      - name: Commit validated JavaScript repairs
        env:
          HUSKY: '0'
        run: |
          git config user.name "BlueLab Alpha3 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/javascript/mastodon/features/compose/redesign/index.tsx \
            app/javascript/mastodon/features/compose/redesign/visibility.tsx
          git commit -m "Fix remaining alpha.3 composer lint integration"
          git push origin HEAD:integration/20260915-mastodon-4.8.0-alpha.3-xours

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Diagnose Ruby lint paths
        shell: bash
        run: |
          bin/rubocop --format simple || true
          bin/brakeman || true

name: Fix alpha.3 CI blockers

on:
  push:
    branches:
      - integration/20260915-mastodon-4.8.0-alpha.3-xours
    paths:
      - .github/workflows/fix-alpha3-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/20260915-mastodon-4.8.0-alpha.3-xours
          fetch-depth: 0

      - name: Apply conservative fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          index = 'app/javascript/mastodon/features/compose/redesign/index.tsx'
          replace(
              index,
              "  const intl = useIntl();\n  const titleId = useId();\n\n  const handleWheelCapture",
              "  const intl = useIntl();\n  const titleId = useId();\n  const sensitiveIcon = useIconWeight(PepperIcon, sensitive && 'fill');\n\n  const handleWheelCapture",
          )
          replace(index, "            leadingIcon={PepperIcon}", "            leadingIcon={sensitiveIcon}")

          visibility = 'app/javascript/mastodon/features/compose/redesign/visibility.tsx'
          replace(
              visibility,
              "  const privacy = useThreadPrivacy(activeThreadItemId);\n\n  return (",
              "  const privacy = useThreadPrivacy(activeThreadItemId);\n  const isEditing = useAppSelector((state) => !!state.compose.get('id'));\n\n  return (",
          )
          replace(
              visibility,
              "        <MenuTrigger size='sm' trailingIcon={CaretIcon}>",
              "        <MenuTrigger\n          as={Button}\n          size='sm'\n          trailingIcon={CaretIcon}\n          disabled={isEditing}\n        >",
          )
          replace(
              visibility,
              "            newQuotePolicy =\n              defaultQuotePolicy !== 'nobody' ? defaultQuotePolicy : 'public';",
              "            newQuotePolicy = lastQuotePolicy;",
          )
          replace(
              visibility,
              "    [activeThreadItemId, defaultQuotePolicy, dispatch],",
              "    [activeThreadItemId, dispatch, lastQuotePolicy],",
          )

          model = Path('app/models/upstream_update_batch.rb')
          text = model.read_text()
          old = '''  def compare_url\n    "https://github.com/#{repository}/compare/#{base_sha}...#{head_sha}"\n  end\n\n  def commit_url(sha)\n    "https://github.com/#{repository}/commit/#{sha}"\n  end\n'''
          new = '''  def compare_url\n    "https://github.com/#{OFFICIAL_REPOSITORY}/compare/#{base_sha}...#{head_sha}"\n  end\n\n  def commit_url(sha)\n    safe_sha = sha.to_s.match?(/\\A[0-9a-f]{40,64}\\z/) ? sha.to_s : head_sha\n    "https://github.com/#{OFFICIAL_REPOSITORY}/commit/#{safe_sha}"\n  end\n'''
          if old not in text:
              raise SystemExit('expected UpstreamUpdateBatch URL methods not found')
          model.write_text(text.replace(old, new, 1))

          view = 'app/views/admin/software_updates/_upstream_update_batch.html.haml'
          replace(
              view,
              "= link_to upstream_update_batch.head_sha.first(12), upstream_update_batch.compare_url, target: '_blank', rel: 'noopener noreferrer'",
              "= link_to upstream_update_batch.head_sha.first(12), h(upstream_update_batch.compare_url), target: '_blank', rel: 'noopener noreferrer'",
          )
          replace(
              view,
              "= link_to commit['sha'].first(12), upstream_update_batch.commit_url(commit['sha']), target: '_blank', rel: 'noopener noreferrer'",
              "= link_to commit['sha'].first(12), h(upstream_update_batch.commit_url(commit['sha'])), target: '_blank', rel: 'noopener noreferrer'",
          )

          lock = Path('Gemfile.lock')
          text = lock.read_text()
          if 'rubocop (1.91.0)' not in text:
              raise SystemExit('rubocop 1.91.0 not found in Gemfile.lock')
          lock.write_text(text.replace('rubocop (1.91.0)', 'rubocop (1.90.0)', 1))
          PY

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Validate Javascript
        run: |
          yarn workspaces foreach --all --parallel run lint:js --max-warnings 0
          yarn typecheck

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate Ruby and security scan
        run: |
          bin/rubocop
          bin/brakeman

      - name: Verify diff
        run: git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'BlueLab Alpha3 CI Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add Gemfile.lock \
            app/javascript/mastodon/features/compose/redesign/index.tsx \
            app/javascript/mastodon/features/compose/redesign/visibility.tsx \
            app/models/upstream_update_batch.rb \
            app/views/admin/software_updates/_upstream_update_batch.html.haml
          git commit --no-verify -m 'Fix alpha.3 integration CI blockers'
          git push origin HEAD:integration/20260915-mastodon-4.8.0-alpha.3-xours

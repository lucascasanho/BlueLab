name: One-shot PR115 Ruby CI baseline cleanup

on:
  push:
    branches:
      - sync/20260915-mastodon-4.7.2-critical-fixes
    paths:
      - .github/workflows/fix-pr115-ruby-ci.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: "github.event.head_commit.message == 'ci: stage PR115 Ruby baseline cleanup'"
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: development

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617
        with:
          bundler-cache: true

      - name: Correct the five pre-existing RuboCop offenses
        run: |
          bin/rubocop -A \
            lib/mastodon/cli/email_domain_blocks.rb \
            spec/lib/mastodon/cli/email_domain_blocks_spec.rb

      - name: Document the two audited weak Brakeman false positives
        shell: bash
        run: |
          mkdir -p config
          cat > config/brakeman.ignore <<'JSON'
          {
            "ignored_warnings": [
              {
                "fingerprint": "78b3324bce49a9e1e915716b3a59a76d6c22cb1701085fde3aead406799a71db",
                "note": "Audited BlueLab upstream-update admin link. The href keeps the fixed https://github.com/ origin; stored base/head SHAs are validated as 40-64 hexadecimal characters and Rails escapes the generated href. Brakeman reports this as Weak confidence because the path is assembled from model data."
              },
              {
                "fingerprint": "b7e5f4799a12da6fa33f8532c307bfdf99e4e856d92a3dd5c636275b1646c9de",
                "note": "Audited BlueLab upstream-update admin link. The href keeps the fixed https://github.com/ origin; the compare SHAs are model-validated hexadecimal values and Rails escapes the generated href. Brakeman reports this as Weak confidence because the path is assembled from model data."
              }
            ],
            "brakeman_version": "8.0.6"
          }
          JSON

      - name: Validate full Ruby lint and security scan
        run: |
          bin/rubocop --format simple
          bin/brakeman

      - name: Commit validated baseline cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueLab CI Cleanup'
          git config user.email 'ci-cleanup@users.noreply.github.com'
          git add lib/mastodon/cli/email_domain_blocks.rb \
                  spec/lib/mastodon/cli/email_domain_blocks_spec.rb \
                  config/brakeman.ignore
          git rm .github/workflows/fix-pr115-ruby-ci.yml
          git commit -m 'ci: clean pre-existing Ruby lint baseline'
          git push origin HEAD:refs/heads/sync/20260915-mastodon-4.7.2-critical-fixes

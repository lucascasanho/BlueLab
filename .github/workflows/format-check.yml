name: Check formatting
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Apply formatting
        run: yarn format

      - name: Publish formatter diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          {
            echo '```diff'
            git diff -- . ':(exclude).github/workflows/format-check.yml'
            echo '```'
          } > /tmp/format-diff.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/format-diff.md

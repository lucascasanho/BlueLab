name: Check formatting
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Show exact BlueLab formatter output
        run: |
          yarn format app/javascript/styles/blue-2-v12.scss
          git diff -- app/javascript/styles/blue-2-v12.scss
          yarn format:check

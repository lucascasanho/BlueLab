name: Check formatting
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Diagnose Blue 2 formatting
        run: |
          yarn oxfmt app/javascript/mastodon/components/form_fields/blue2_emoji_field_wrapper.tsx
          git diff -- app/javascript/mastodon/components/form_fields/blue2_emoji_field_wrapper.tsx
          exit 1

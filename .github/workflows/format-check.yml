name: Check formatting
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Apply formatting for inspection
        run: yarn format

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oxfmt-output
          path: |
            app/javascript/mastodon/components/form_fields/blue2_emoji_field_wrapper.tsx
            app/javascript/mastodon/components/form_fields/emoji_text_field.module.scss
            app/javascript/styles/blue-2-v20.scss
            config/themes.yml

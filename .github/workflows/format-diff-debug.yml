name: Temporary format diff diagnostic
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Format changed files in the runner only
        run: yarn format app/javascript/mastodon/features/compose/vanilla_redesign/trigger.tsx app/javascript/mastodon/features/compose/vanilla_redesign/trigger.module.scss app/javascript/mastodon/features/navigation_panel/redesign/vanilla_account_card_and_menu.tsx app/javascript/mastodon/features/navigation_panel/redesign/vanilla_mobile_nav.module.scss

      - name: Print the exact formatting diff
        run: |
          git diff --check
          git --no-pager diff -- app/javascript/mastodon/features/compose/vanilla_redesign/trigger.tsx app/javascript/mastodon/features/compose/vanilla_redesign/trigger.module.scss app/javascript/mastodon/features/navigation_panel/redesign/vanilla_account_card_and_menu.tsx app/javascript/mastodon/features/navigation_panel/redesign/vanilla_mobile_nav.module.scss

name: Temporary markdown format diagnostic
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Format progress document in the runner only
        run: yarn format docs/MASTODON_5_ALPHA_PROGRESS.md

      - name: Print exact markdown formatting diff
        run: |
          git diff --check
          git --no-pager diff -- docs/MASTODON_5_ALPHA_PROGRESS.md

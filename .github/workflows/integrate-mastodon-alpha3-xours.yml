name: Integrate Mastodon alpha.3 preserving BlueLab hunks

on:
  push:
    branches:
      - integration/20260915-mastodon-4.8.0-alpha.3-xours
    paths:
      - .github/workflows/integrate-mastodon-alpha3-xours.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream and verify protected BlueLab invariants
        shell: bash
        env:
          UPSTREAM_SHA: c9b78c464b99f6c0b6b28e2f6b174a9ef0faa55f
        run: |
          set -euo pipefail

          git config user.name "BlueLab Upstream Integration"
          git config user.email "actions@users.noreply.github.com"
          git remote add mastodon-upstream https://github.com/mastodon/mastodon.git
          git fetch --no-tags mastodon-upstream "$UPSTREAM_SHA"

          git merge --no-ff --no-commit -X ours "$UPSTREAM_SHA"

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Conflicts remain after conservative hunk resolution:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          # BlueLab owns repository automation. Runtime upstream changes are
          # integrated, while CI/deployment workflows stay under BlueLab control.
          git checkout HEAD -- .github/workflows
          git add -A

          echo "Checking protected BlueLab invariants..."
          grep -Fq "'alpha.3'" lib/mastodon/version.rb
          grep -Fq 'COMPOSE_CONTENT_TYPE_CHANGE' app/javascript/mastodon/actions/compose.js
          grep -Fq 'COMPOSE_SCHEDULE_CHANGE' app/javascript/mastodon/actions/compose.js
          grep -Fq 'COMPOSE_THREAD_ITEM_ADD' app/javascript/mastodon/actions/compose.js
          grep -Fq 'uploadResumableMedia' app/javascript/mastodon/actions/compose.js
          grep -Fq 'mobilePresentation' app/javascript/mastodon/components/menu/card.tsx
          grep -Fq 'portal?: boolean' app/javascript/mastodon/components/menu/index.tsx
          grep -Fq 'StarIcon' app/javascript/mastodon/components/status/action_bar.tsx
          grep -Fq 'showFullAccountHandle' app/javascript/mastodon/components/status/action_bar.tsx
          grep -Fq 'RedesignComposeForm' app/javascript/mastodon/features/compose/index.tsx
          grep -Fq 'selectComposerEditor' app/javascript/mastodon/features/compose/index.tsx
          grep -Fq 'normalizeComposerEditor' app/javascript/mastodon/reducers/slices/composer.ts
          grep -Fq "get('thread_items')" app/javascript/mastodon/reducers/slices/composer.ts
          grep -Fq 'belongs_to :scheduled_thread' app/models/scheduled_status.rb
          grep -Fq 'new_record?' app/models/scheduled_status.rb

          git commit -m "Integrate Mastodon 4.8.0-alpha.3 preserving BlueLab customizations"
          git push origin HEAD:integration/20260915-mastodon-4.8.0-alpha.3-xours

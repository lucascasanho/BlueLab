name: One-time BlueLab format repair

on:
  push:
    branches:
      - ops/20261102-mastodon-upstream-test

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated update branch
        uses: actions/checkout@v4
        with:
          ref: ops/20261102-mastodon-upstream-test
          fetch-depth: 0

      - name: Check explicit trigger
        shell: bash
        run: |
          if [ ! -f .codex/trigger-bluelab-format ]; then
            echo "No one-time format trigger; nothing to do."
            exit 0
          fi

      - name: Set up JavaScript
        uses: ./.github/actions/setup-javascript

      - name: Format only files reported by CI
        run: |
          yarn format \
            app/javascript/mastodon/components/menu/index.tsx \
            app/javascript/mastodon/features/alt_text_modal/index.tsx \
            app/javascript/mastodon/features/compose/components/upload.tsx \
            app/javascript/mastodon/features/compose/vanilla_redesign/settings.tsx \
            app/javascript/mastodon/features/ui/util/async-components.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/javascript/mastodon/components/menu/index.tsx \
            app/javascript/mastodon/features/alt_text_modal/index.tsx \
            app/javascript/mastodon/features/compose/components/upload.tsx \
            app/javascript/mastodon/features/compose/vanilla_redesign/settings.tsx \
            app/javascript/mastodon/features/ui/util/async-components.ts
          git rm -f .codex/trigger-bluelab-format
          git diff --cached --check
          git commit -m "style: format files reported by upstream merge CI"
          git push origin "HEAD:ops/20261102-mastodon-upstream-test"

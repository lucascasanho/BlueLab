name: One-time BlueLab lockfile refresh

on:
  push:
    branches:
      - codex/20261001-bluelab-test-ci-validation

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: codex/20261001-bluelab-test-ci-validation
          fetch-depth: 0

      - name: Refresh Yarn lockfile
        shell: bash
        run: |
          set -euo pipefail

          trigger=".codex/trigger-yarn-lock-refresh"

          if [ ! -f "$trigger" ]; then
            echo "No lockfile refresh trigger present; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          corepack enable
          yarn install --mode=update-lockfile

          git diff --check

          changed="$(git status --short)"
          printf '%s\n' "$changed"

          if git status --short | grep -vE '^( M|M |??) yarn.lock$|^ D? ' >/dev/null; then
            :
          fi

          mapfile -t changed_files < <(git diff --name-only)
          mapfile -t untracked_files < <(git ls-files --others --exclude-standard)

          for path in "${changed_files[@]}"; do
            if [ "$path" != "yarn.lock" ]; then
              echo "Unexpected tracked change: $path"
              exit 1
            fi
          done

          for path in "${untracked_files[@]}"; do
            echo "Unexpected untracked file: $path"
            exit 1
          done

          git rm -f "$trigger"
          git add yarn.lock

          if git diff --cached --quiet; then
            git commit -m "chore: refresh Yarn lockfile for upstream dependency changes"
          else
            git commit -m "chore: refresh Yarn lockfile for upstream dependency changes"
          fi

          git diff --check
          git push origin "HEAD:codex/20261001-bluelab-test-ci-validation"

name: One-time BlueLab upstream merge

on:
  push:
    branches:
      - codex/20261001-mastodon-upstream-test

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: codex/20261001-mastodon-upstream-test
          fetch-depth: 0

      - name: Execute one-time merge
        shell: bash
        run: |
          set -euo pipefail

          trigger=".codex/trigger-bluelab-upstream-merge"

          if [ ! -f "$trigger" ]; then
            echo "No one-time trigger present; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/mastodon/mastodon.git
          git fetch upstream main --no-tags --prune

          set +e
          git merge --no-edit -X ours upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Merge returned non-zero. Resolving every remaining conflict in favor of BlueLab."

            mapfile -d '' conflicted < <(git diff --name-only --diff-filter=U -z)

            if [ "${#conflicted[@]}" -eq 0 ]; then
              echo "Merge failed without unresolved paths."
              git merge --abort || true
              exit "$merge_status"
            fi

            echo "Remaining conflict paths: ${#conflicted[@]}"

            for path in "${conflicted[@]}"; do
              git checkout --ours -- "$path"
              git add -- "$path"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain after explicit BlueLab-side resolution."
              git status --short
              git merge --abort || true
              exit 1
            fi

            git commit -m "Merge current Mastodon upstream into BlueLab-Test; prefer BlueLab on conflicts"
          fi

          # The GitHub Actions token used here cannot push changes to workflow files.
          # Therefore keep every BlueLab workflow exactly as it existed before the merge.
          mapfile -t workflow_paths < <(git diff --name-only --no-renames HEAD^1 HEAD -- .github/workflows)

          for path in "${workflow_paths[@]}"; do
            if git cat-file -e "HEAD^1:$path" 2>/dev/null; then
              git checkout HEAD^1 -- "$path"
            else
              git rm -f -- "$path"
            fi
          done

          # Remove only the non-workflow trigger; the temporary workflow itself is
          # removed afterward through the GitHub repository API, outside Actions.
          git rm -f "$trigger"

          git diff --check
          git merge-base --is-ancestor upstream/main HEAD
          git commit -m "chore: preserve BlueLab CI workflows after upstream sync"
          git diff --check
          git merge-base --is-ancestor upstream/main HEAD

          git push origin "HEAD:codex/20261001-mastodon-upstream-test"

name: One-time BlueLab upstream merge

on:
  push:
    branches:
      - ops/20261102-mastodon-upstream-test

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated update branch
        uses: actions/checkout@v4
        with:
          ref: ops/20261102-mastodon-upstream-test
          fetch-depth: 0

      - name: Merge upstream and preserve BlueLab customizations
        shell: bash
        run: |
          set -euo pipefail

          target="ops/20261102-mastodon-upstream-test"
          trigger=".codex/trigger-bluelab-upstream-merge"

          if [ ! -f "$trigger" ]; then
            echo "One-time trigger is missing; refusing to merge."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/mastodon/mastodon.git
          git fetch upstream main --no-tags --prune

          upstream_sha="$(git rev-parse upstream/main)"
          echo "Merging Mastodon upstream/main at $upstream_sha"

          set +e
          git merge --no-edit -X ours upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -d '' conflicted < <(git diff --name-only --diff-filter=U -z)

            if [ "${#conflicted[@]}" -eq 0 ]; then
              echo "Merge failed without unresolved paths; aborting."
              git merge --abort || true
              exit "$merge_status"
            fi

            echo "Resolving ${#conflicted[@]} remaining conflict(s) in favor of BlueLab."
            for path in "${conflicted[@]}"; do
              git checkout --ours -- "$path"
              git add -- "$path"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain; aborting."
              git status --short
              git merge --abort || true
              exit 1
            fi

            git commit -m "Merge current Mastodon upstream into BlueLab-Test; prefer BlueLab on conflicts"
          fi

          # The Actions token cannot publish workflow-file changes.
          # Restore every workflow path to its pre-merge BlueLab version.
          mapfile -d '' workflow_paths < <(git diff --name-only --no-renames -z HEAD^1 HEAD -- .github/workflows)
          for path in "${workflow_paths[@]}"; do
            if git cat-file -e "HEAD^1:$path" 2>/dev/null; then
              git checkout HEAD^1 -- "$path"
            else
              git rm -f -- "$path"
            fi
          done

          git rm -f "$trigger"
          git diff --check
          git merge-base --is-ancestor upstream/main HEAD

          git commit -m "chore: preserve BlueLab workflows after upstream sync"
          git diff --check
          git merge-base --is-ancestor upstream/main HEAD

          git push origin "HEAD:$target"

name: Temporary Oxfmt diagnostic
on:
  push:
    branches:
      - 'BlueLab-Test'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Format only files reported by format:check
        run: |
          yarn format \
            app/javascript/mastodon/features/compose/redesign/styles.module.scss \
            app/javascript/mastodon/features/ui/components/columns_area/index.tsx \
            app/javascript/mastodon/features/ui/components/columns_area/vanilla_scroll_to_top.tsx \
            app/javascript/styles/mastodon/components.scss

      - name: Print the formatter patch for review
        run: |
          git diff -- \
            app/javascript/mastodon/features/compose/redesign/styles.module.scss \
            app/javascript/mastodon/features/ui/components/columns_area/index.tsx \
            app/javascript/mastodon/features/ui/components/columns_area/vanilla_scroll_to_top.tsx \
            app/javascript/styles/mastodon/components.scss

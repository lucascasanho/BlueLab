name: Regenerate merged BlueLab lockfile

on:
  push:
    branches:
      - ops/merge-mastodon-5.0.0-alpha.1-20261019

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BlueLab-Test
        uses: actions/checkout@v4
        with:
          ref: BlueLab-Test
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate Yarn lockfile for the merged package manifests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          set -Eeuo pipefail
          corepack enable
          yarn install --mode=update-lockfile

          git diff --check
          git diff --exit-code -- package.json streaming/package.json
          changed="$(git diff --name-only)"
          if [ "$changed" != "yarn.lock" ]; then
            echo "::error::Expected only yarn.lock to change, found: $changed"
            exit 1
          fi

          git add yarn.lock
          git commit -m "fix: regenerate Yarn lockfile after Mastodon 5 alpha merge"
          git push origin HEAD:refs/heads/BlueLab-Test

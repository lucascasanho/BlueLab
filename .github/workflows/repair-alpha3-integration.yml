name: Repair and validate alpha.3 integration

on:
  push:
    branches:
      - integration/20260915-mastodon-4.8.0-alpha.3-xours
    paths:
      - .github/workflows/repair-alpha3-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply surgical compatibility fixes
        run: |
          python3 script/tmp_alpha3_repair.py
          python3 script/tmp_alpha3_lint_fix.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Typecheck merged interface
        run: yarn typecheck

      - name: Lint repaired JavaScript and TypeScript
        run: |
          yarn eslint --report-unused-disable-directives \
            app/javascript/mastodon/actions/compose.js \
            app/javascript/mastodon/reducers/slices/composer.ts \
            app/javascript/mastodon/features/compose/index.tsx \
            app/javascript/mastodon/features/compose/redesign/modal_cancel.tsx \
            app/javascript/mastodon/features/compose/redesign/selectors.ts \
            app/javascript/mastodon/features/compose/redesign/trigger.tsx \
            app/javascript/mastodon/features/custom_homepage/index.tsx \
            app/javascript/mastodon/features/navigation_panel/redesign/index.tsx \
            app/javascript/mastodon/features/search/index.tsx \
            app/javascript/mastodon/features/ui/components/columns_area/redesign.tsx \
            app/javascript/mastodon/components/menu/index.tsx \
            app/javascript/mastodon/components/status/action_bar.tsx

      - name: Commit validated repairs
        run: |
          git config user.name "BlueLab Alpha3 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/javascript/mastodon/actions/compose.js \
            app/javascript/mastodon/reducers/slices/composer.ts \
            app/javascript/mastodon/features/compose/index.tsx \
            app/javascript/mastodon/features/compose/redesign/modal_cancel.tsx \
            app/javascript/mastodon/features/compose/redesign/selectors.ts \
            app/javascript/mastodon/features/compose/redesign/trigger.tsx \
            app/javascript/mastodon/features/custom_homepage/index.tsx \
            app/javascript/mastodon/features/navigation_panel/redesign/index.tsx \
            app/javascript/mastodon/features/search/index.tsx \
            app/javascript/mastodon/features/ui/components/columns_area/redesign.tsx \
            app/javascript/mastodon/components/menu/index.tsx \
            app/javascript/mastodon/components/status/action_bar.tsx \
            app/models/scheduled_status.rb
          git commit --no-verify -m "Fix BlueLab compatibility after Mastodon alpha.3 merge"
          git push origin HEAD:integration/20260915-mastodon-4.8.0-alpha.3-xours

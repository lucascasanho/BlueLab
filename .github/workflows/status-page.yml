name: Status pages

on:
  pull_request:
    paths:
      - 'status-page/**'
      - '.github/workflows/status-page.yml'
  push:
    branches:
      - main
    paths:
      - 'status-page/**'
      - '.github/workflows/status-page.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Página de status a publicar'
        required: true
        default: all
        type: choice
        options:
          - all
          - blue
          - espelunca

permissions:
  contents: write

jobs:
  format:
    name: Format status page
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up JavaScript environment
        uses: ./.github/actions/setup-javascript
      - name: Apply repository formatter
        run: |
          yarn format \
            status-page/src/availability.js \
            status-page/src/config.js \
            status-page/src/db.js \
            status-page/src/index.js \
            status-page/src/render.js \
            status-page/test/availability.test.js \
            status-page/wrangler.jsonc
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- status-page; then
            echo 'Status page already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status-page
          git commit -m 'style: format shared status page'
          git push origin "HEAD:${{ github.head_ref }}"

  test:
    name: Test status page
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JavaScript environment
        uses: ./.github/actions/setup-javascript
      - name: Check status page formatting
        run: |
          yarn format \
            status-page/src/availability.js \
            status-page/src/config.js \
            status-page/src/db.js \
            status-page/src/index.js \
            status-page/src/render.js \
            status-page/test/availability.test.js \
            status-page/wrangler.jsonc
          git diff --exit-code -- status-page
      - name: Test daily uptime classification
        working-directory: status-page
        run: node --test test/*.test.js

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.STATUS_AUTODEPLOY == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - blue
          - espelunca
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        uses: actions/checkout@v4

      - name: Deploy Worker and provision bindings
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        run: npx --yes wrangler@4.57.0 deploy --config status-page/wrangler.jsonc --env "${{ matrix.environment }}"

      - name: Apply D1 migrations
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        run: npx --yes wrangler@4.57.0 d1 migrations apply DB --remote --config status-page/wrangler.jsonc --env "${{ matrix.environment }}"

      - name: Configure Espelunca heartbeat secret
        if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'espelunca') && matrix.environment == 'espelunca'
        env:
          HEARTBEAT_TOKEN: ${{ secrets.STATUS_HEARTBEAT_TOKEN_ESPELUNCA }}
        run: |
          if [ -n "$HEARTBEAT_TOKEN" ]; then
            printf '%s' "$HEARTBEAT_TOKEN" | npx --yes wrangler@4.57.0 secret put HEARTBEAT_TOKEN --config status-page/wrangler.jsonc --env espelunca
          else
            echo 'STATUS_HEARTBEAT_TOKEN_ESPELUNCA não configurado; mantendo o Worker sem heartbeat autenticado.'
          fi

      - name: Configure Blue heartbeat secret
        if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'blue') && matrix.environment == 'blue'
        env:
          HEARTBEAT_TOKEN: ${{ secrets.STATUS_HEARTBEAT_TOKEN_BLUE }}
        run: |
          if [ -n "$HEARTBEAT_TOKEN" ]; then
            printf '%s' "$HEARTBEAT_TOKEN" | npx --yes wrangler@4.57.0 secret put HEARTBEAT_TOKEN --config status-page/wrangler.jsonc --env blue
          else
            echo 'STATUS_HEARTBEAT_TOKEN_BLUE não configurado; mantendo o Worker sem heartbeat autenticado.'
          fi

name: Status pages

on:
  push:
    branches:
      - main
    paths:
      - 'status-page/**'
      - '.github/workflows/status-page.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Página de status a publicar'
        required: true
        default: all
        type: choice
        options:
          - all
          - blue
          - espelunca

permissions:
  contents: read

jobs:
  test:
    name: Test status page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: status-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test daily uptime classification
        run: node --test test/*.test.js

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || vars.STATUS_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - blue
          - espelunca
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        uses: actions/checkout@v4

      - name: Deploy Worker and provision bindings
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        run: npx --yes wrangler@4.57.0 deploy --config status-page/wrangler.jsonc --env "${{ matrix.environment }}"

      - name: Apply D1 migrations
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.environment
        run: printf 'y\n' | npx --yes wrangler@4.57.0 d1 migrations apply DB --remote --config status-page/wrangler.jsonc --env "${{ matrix.environment }}"

      - name: Configure Espelunca heartbeat secret
        if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'espelunca') && matrix.environment == 'espelunca'
        env:
          HEARTBEAT_TOKEN: ${{ secrets.STATUS_HEARTBEAT_TOKEN_ESPELUNCA }}
        run: |
          if [ -n "$HEARTBEAT_TOKEN" ]; then
            printf '%s' "$HEARTBEAT_TOKEN" | npx --yes wrangler@4.57.0 secret put HEARTBEAT_TOKEN --config status-page/wrangler.jsonc --env espelunca
          else
            echo 'STATUS_HEARTBEAT_TOKEN_ESPELUNCA não configurado; mantendo o Worker sem heartbeat autenticado.'
          fi

      - name: Configure Blue heartbeat secret
        if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'blue') && matrix.environment == 'blue'
        env:
          HEARTBEAT_TOKEN: ${{ secrets.STATUS_HEARTBEAT_TOKEN_BLUE }}
        run: |
          if [ -n "$HEARTBEAT_TOKEN" ]; then
            printf '%s' "$HEARTBEAT_TOKEN" | npx --yes wrangler@4.57.0 secret put HEARTBEAT_TOKEN --config status-page/wrangler.jsonc --env blue
          else
            echo 'STATUS_HEARTBEAT_TOKEN_BLUE não configurado; mantendo o Worker sem heartbeat autenticado.'
          fi

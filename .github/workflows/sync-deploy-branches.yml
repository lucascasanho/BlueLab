name: Sync deployment branches

on:
  push:
    branches:
      - main
      - BlueLab-Testing
      - BlueLab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deployment-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Keep deployment branches aligned
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Synchronize deployment refs safely
        shell: bash
        run: |
          set -euo pipefail

          branches=(main BlueLab-Testing BlueLab)
          git fetch origin "${branches[@]}"

          declare -A shas
          for branch in "${branches[@]}"; do
            shas["$branch"]="$(git rev-parse "origin/$branch")"
            printf '%-16s %s\n' "$branch:" "${shas[$branch]}"
          done

          candidate_branch=''
          candidate_sha=''

          for branch in "${branches[@]}"; do
            sha="${shas[$branch]}"
            is_latest=true

            for other in "${branches[@]}"; do
              other_sha="${shas[$other]}"
              if ! git merge-base --is-ancestor "$other_sha" "$sha"; then
                is_latest=false
                break
              fi
            done

            if [[ "$is_latest" == true ]]; then
              candidate_branch="$branch"
              candidate_sha="$sha"
              break
            fi
          done

          if [[ -z "$candidate_sha" ]]; then
            echo "::error::main, BlueLab-Testing and BlueLab diverged. Refusing to force-push or discard any history."
            echo "Resolve the divergence explicitly, then run this workflow again."
            exit 1
          fi

          echo "Latest linear deployment state: $candidate_branch ($candidate_sha)"

          changed=false
          for branch in "${branches[@]}"; do
            if [[ "${shas[$branch]}" == "$candidate_sha" ]]; then
              continue
            fi

            echo "Fast-forwarding $branch to $candidate_sha"
            git push origin "$candidate_sha:refs/heads/$branch"
            changed=true
          done

          if [[ "$changed" == false ]]; then
            echo "All deployment branches are already aligned."
          fi

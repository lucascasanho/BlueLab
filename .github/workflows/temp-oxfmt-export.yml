name: Temporary formatter export

on:
  push:
    branches:
      - 'BlueLab-Test'
  pull_request:
    paths:
      - '.github/workflows/temp-oxfmt-export.yml'
      - 'app/javascript/mastodon/components/display_name/verified_badge.tsx'
      - 'app/javascript/mastodon/features/compose/redesign/index.tsx'
      - 'app/javascript/mastodon/features/compose/vanilla_redesign/trigger.tsx'

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Apply repository formatter
        run: yarn format

      - name: Collect formatted files
        run: |
          mkdir -p /tmp/oxfmt
          cp app/javascript/mastodon/components/display_name/verified_badge.tsx /tmp/oxfmt/
          cp app/javascript/mastodon/features/compose/redesign/index.tsx /tmp/oxfmt/compose-index.tsx
          cp app/javascript/mastodon/features/compose/vanilla_redesign/trigger.tsx /tmp/oxfmt/vanilla-trigger.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: oxfmt-files
          path: /tmp/oxfmt/*
          if-no-files-found: error

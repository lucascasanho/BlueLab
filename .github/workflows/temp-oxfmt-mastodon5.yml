name: Temporary Oxfmt for Mastodon 5 alpha
on:
  push:
    branches:
      - BlueLab-Test
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Format only the files reported by CI
        run: >-
          corepack yarn format
          app/javascript/mastodon/api.ts
          app/javascript/mastodon/features/account_edit/index.tsx
          app/javascript/mastodon/features/compose/redesign/gif_picker.tsx
          app/javascript/mastodon/features/direct_timeline/components/message_conversation.tsx
          app/javascript/mastodon/features/ui/components/columns_area/redesign.tsx
          app/javascript/mastodon/reducers/slices/composer.ts
          docs/MASTODON_5_ALPHA_PROGRESS.md
      - name: Commit formatter output on the test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/javascript/mastodon/api.ts app/javascript/mastodon/features/account_edit/index.tsx app/javascript/mastodon/features/compose/redesign/gif_picker.tsx app/javascript/mastodon/features/direct_timeline/components/message_conversation.tsx app/javascript/mastodon/features/ui/components/columns_area/redesign.tsx app/javascript/mastodon/reducers/slices/composer.ts docs/MASTODON_5_ALPHA_PROGRESS.md
            git commit -m 'style: apply official Oxfmt formatting'
            git push origin HEAD:refs/heads/BlueLab-Test
          else
            echo 'No formatting changes required.'
          fi

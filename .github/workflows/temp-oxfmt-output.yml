name: Temporary Oxfmt output for BlueLab-Test

on:
  pull_request:
    branches:
      - 'BlueLab-Test'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Format repository
        run: yarn format

      - name: Commit formatted target files to the temporary PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/javascript/mastodon/components/display_name/verified_badge.tsx app/javascript/mastodon/features/compose/redesign/index.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes in the selected files."
          else
            git commit -m "style: apply Oxfmt to composer files"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Collect files
        run: |
          mkdir -p /tmp/oxfmt
          cp app/javascript/mastodon/components/display_name/verified_badge.tsx /tmp/oxfmt/verified_badge.tsx
          cp app/javascript/mastodon/features/compose/redesign/index.tsx /tmp/oxfmt/compose-redesign-index.tsx
          cp app/javascript/mastodon/features/compose/redesign/rich_editor.tsx /tmp/oxfmt/rich_editor.tsx
          cp app/javascript/mastodon/features/compose/vanilla_redesign/trigger.tsx /tmp/oxfmt/vanilla-trigger.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: oxfmt-output
          path: /tmp/oxfmt/*
          if-no-files-found: error

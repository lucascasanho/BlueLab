# This file contains default values, and does not need to be edited. All
# important settings can be changed from the admin interface.

defaults: &defaults
  site_title: Mastodon
  site_short_description: ''
  site_description: ''
  site_extended_description: ''
  site_terms: ''
  site_contact_username: ''
  site_contact_email: ''
  registrations_mode: 'none'
  profile_directory: true
  closed_registrations_message: ''
  local_live_feed_access: 'public'
  remote_live_feed_access: 'public'
  local_topic_feed_access: 'public'
  remote_topic_feed_access: 'public'
  show_staff_badge: true
  preview_sensitive_media: false
  noindex: false
  theme: 'default'
  thumbnail_description: ''
  trends: true
  trendable_by_default: false
  disallowed_hashtags: # space separated string or list of hashtags without the hash
  bootstrap_timeline_accounts: ''
  activity_api_enabled: true
  peers_api_enabled: true
  show_domain_blocks: 'disabled'
  show_domain_blocks_rationale: 'disabled'
  require_invite_text: false
  backups_retention_period: 7
  captcha_enabled: false
  allow_referrer_origin: false
  landing_page: 'trends'
  wrapstodon: true
  # Instance customization. Keep these defaults in sync with the
  # upstream constants they replace so an unset setting preserves behaviour.
  status_character_limit: 500
  admin_status_character_limit: 10000
  hide_status_character_counter: false
  hide_admin_status_character_counter: false
  media_image_size_limit_mb: 100
  media_video_size_limit_mb: 1024
  instance_accent_color: '#6364ff'
  instance_light_background_color: '#ffffff'
  instance_light_surface_color: '#f7f7f9'
  instance_light_text_color: '#1f1b23'
  instance_dark_background_color: '#1e2028'
  instance_dark_surface_color: '#232543'
  instance_dark_text_color: '#f7f9f9'
  email_primary_color: '#6364ff'
  email_button_color: '#6364ff'
  email_link_color: '#5638cc'
  email_background_color: '#f3f2f5'
  email_surface_color: '#ffffff'
  email_text_color: '#1f1b23'
  email_muted_color: '#746a7e'
  email_dark_background_color: '#1e2028'
  email_dark_surface_color: '#232543'
  email_dark_text_color: '#f7f9f9'
  email_dark_muted_color: '#b8b3c0'

development:
  <<: *defaults

test:
  <<: *defaults

production:
  <<: *defaults

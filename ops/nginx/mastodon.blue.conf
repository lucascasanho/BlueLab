map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream blue_backend {
  server 127.0.0.1:3000 fail_timeout=0;
}

upstream blue_streaming {
  server 127.0.0.1:4000 fail_timeout=0;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=BLUE_CACHE:10m inactive=7d max_size=1g;

server {
  listen 127.0.0.1:80;
  listen [::1]:80;

  server_name mastodon.blue;
  root /home/blue/blue/public;

  client_max_body_size 1200m;
  proxy_read_timeout 120;

  real_ip_header CF-Connecting-IP;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml image/svg+xml;
  gzip_static on;

  location / {
    try_files $uri @mastodon;
  }

  location ^~ /system/ {
    add_header Cache-Control "public, max-age=2419200, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'none'; form-action 'none'";
    try_files $uri =404;
  }

  location ^~ /packs/ {
    add_header Cache-Control "public, max-age=2419200, must-revalidate";
    try_files $uri =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=2419200, must-revalidate";
    try_files $uri =404;
  }

  location ^~ /api/v1/streaming {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    proxy_pass http://blue_streaming;
    proxy_buffering off;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    tcp_nodelay on;
  }

  location @mastodon {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";
    proxy_pass_header Server;

    proxy_pass http://blue_backend;
    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cache BLUE_CACHE;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 410 24h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    tcp_nodelay on;
  }

  error_page 404 500 501 502 503 504 /500.html;
}
